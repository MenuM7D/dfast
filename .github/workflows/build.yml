name: Build APK

# The Android project lives in the dfast/ subdirectory of this repository,
# so every build step runs with working-directory: dfast.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dfast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Gradle wrapper and properties
        run: |
          chmod +x gradlew
          touch local.properties

      - name: Build github debug APK
        run: ./gradlew assembleGithubDebug --no-daemon --stacktrace

      - name: List built APKs
        run: ls -lh app/build/outputs/apk/github/debug/

      # Best effort: the account's Actions artifact quota is shared and can be
      # exhausted, which must not fail an otherwise good build.
      - name: Upload APKs as workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dfast-debug-apk
          path: dfast/app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: warn

      # Release assets are not subject to the Actions artifact quota, so this
      # is the reliable way to download the APK on a phone.
      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest-build --repo "${{ github.repository }}" >/dev/null 2>&1 ||
            gh release create latest-build \
              --repo "${{ github.repository }}" \
              --prerelease \
              --title "Latest debug build" \
              --notes "Automatic rolling build of the debug APK."
          gh release upload latest-build \
            --repo "${{ github.repository }}" \
            --clobber \
            app/build/outputs/apk/github/debug/*universal*.apk
