plugins {
    id 'com.android.application'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin' version '2.0.1'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id "org.jetbrains.kotlin.plugin.serialization" version "2.3.0"
    id "org.jetbrains.kotlin.plugin.parcelize" version "2.3.0"
    id "org.jetbrains.kotlin.plugin.compose" version "2.3.0"
}

def properties = new Properties()
def versionMajor = 1
def versionMinor = 0
def versionPatch = 2
def versionBuild = 5 // bump for dogfood builds, public betas, etc.
//WHEN RELEASING BETA KEEP THE SAME VERSION AS LATEST STABLE, SO USERS CAN DOWNGRADE
def isBeta = true

def versionExt = ""
if (versionBuild > 0) {
    versionExt += ".${versionBuild}"
}
if (isBeta) {
    versionExt += "-beta"
}

android {
    testOptions { unitTests.returnDefaultValues = true }
    namespace 'dfast.app'
    compileSdk = 36

    try {
        def propertiesFile = rootProject.file("keystore.properties")
        if(propertiesFile.text != ""){
            properties.load(new FileInputStream(propertiesFile))

            properties.load(new FileInputStream(propertiesFile))
            signingConfigs {
                debug {
                    storeFile file(properties["signingConfig.storeFile"])
                    storePassword properties["signingConfig.storePassword"]
                    keyAlias properties["signingConfig.keyAlias"]
                    keyPassword properties["signingConfig.keyPassword"]
                }
            }
        }
    }catch(IOException ignored){}
    defaultConfig {
        applicationId "dfast.app"
        minSdk 24
        targetSdk 36
        // 1000700 + patch*100 + build: patch 1 gives 1000800 + build (unchanged), patch 2 gives 1000900 + build, so every
        // 1.0.2 beta is above the official 1.0.1 (1000899) and installs over it. beta N = base + N (N 1..98); the official = base + 99.
        versionCode 1000700 + versionPatch * 100 + (versionBuild > 0 ? versionBuild : 99)
        versionName "${versionMajor}.${versionMinor}.${versionPatch}${versionExt}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        archivesBaseName = "DFast-$versionName"
        vectorDrawables {
            useSupportLibrary true
        }

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }

        vectorDrawables.generatedDensities = []

    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.debug
        }

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    flavorDimensions "version"
    productFlavors {
        github {
            dimension "version"
            isDefault true
        }
        foss {
            dimension "version"
        }
        izzy {
            dimension "version"
        }
    }


    android.applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            def baseAbiVersionCode = project.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))
            if (baseAbiVersionCode != null) {
                output.versionCodeOverride = (100 * project.android.defaultConfig.versionCode) + baseAbiVersionCode
            } else {
                output.versionCodeOverride = 100 * project.android.defaultConfig.versionCode
            }

            def abi = output.getFilter(com.android.build.OutputFile.ABI) ?: "universal"
            if (variant.flavorName == "github") {
                output.outputFileName = "DFast-${versionName}-${abi}-${variant.buildType.name}-${variant.flavorName}.apk"
            } else {
                output.outputFileName = "DFast-${versionName}-${variant.flavorName}-${abi}-${variant.buildType.name}.apk"
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    splits {
        abi {
            enable true
            reset()
            // betas pass -PdfastAbis=arm64-v8a (CI): one APK, no universal. Not set = every ABI + universal (official releases).
            def onlyAbis = project.findProperty('dfastAbis')
            include(*(onlyAbis ? onlyAbis.toString().split(',').collect { it.trim() } : ['x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a']))
            universalApk(onlyAbis ? false : true)
        }
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.10.1"
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lint {
        disable 'MissingTranslation', 'RestrictedApi'
    }

    androidResources {
        generateLocaleConfig true
    }
}


